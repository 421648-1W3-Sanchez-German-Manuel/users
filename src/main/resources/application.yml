spring:
  application:
    name: users-service
  datasource:
    # DEC-20 rule 2: UTC explicit on the connection - never rely on the host's timezone
    url: ${DB_URL:jdbc:mysql://localhost:3306/users?connectionTimeZone=UTC&preserveInstants=true}
    username: ${DB_USER:root}
    password: ${DB_PASSWORD:}
  jpa:
    hibernate:
      ddl-auto: validate        # Flyway is in charge; Hibernate only verifies
    open-in-view: false
    properties:
      hibernate.jdbc.time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
  kafka:
    bootstrap-servers: ${KAFKA_SERVERS:localhost:9092}
    consumer:
      group-id: users-service
      auto-offset-reset: earliest
      properties:
        spring.json.trusted.packages: "*"
        # DEC-34: if another team adds fields, we do not break
        spring.json.fail.on.unknown.properties: false
  mvc:
    # A route that does not exist has to reach the @RestControllerAdvice as an
    # exception and come out as a 404 route-not-found in problem+json. Without
    # these two, Spring answers its own body with no `type` and the client
    # cannot branch on it.
    throw-exception-if-no-handler-found: true
  web:
    resources:
      add-mappings: false

server:
  port: ${SERVER_PORT:8082}     # DEC-28

management:
  server:
    port: ${MANAGEMENT_PORT:8083}   # DEC-28
  tracing:
    sampling:
      probability: 1.0
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URL:http://localhost:8761/eureka/}
    register-with-eureka: true
    fetch-registry: false        # ONLY the gateway has true
    # Manifiesto del Gateway §10. El heartbeat solo dice "el proceso vive". Con
    # esto lo que Eureka publica es el readiness de Actuator, asi que una
    # instancia sin MySQL o sin Redis sale del balanceo en vez de recibir
    # trafico y contestar 500. El gateway ahi devuelve 503 + Retry-After.
    healthcheck:
      enabled: true
  instance:
    prefer-ip-address: true

# ---------------------------------------------------------------------------
# Contrato de rutas con el API Gateway (convenciones de integracion, slide 04).
# Los dos prefijos viven aca y los @RequestMapping los referencian como
# "${app.api.public-path}/..." / "${app.api.private-path}/...", nunca el
# literal "/api/users...".
# ---------------------------------------------------------------------------
app:
  api:
    public-path: /api/users/public
    private-path: /api/users

# ---------------------------------------------------------------------------
# Every lot adds its own block below. This file has ONE owner (see
# docs/TASK-ASSIGNMENT.md): send the block instead of committing it, or six
# branches collide in the same place.
#
#   users.jwt          -> L2  (keys, issuer, token TTLs)
#   users.otp          -> L3  (OTP and activation TTLs)
#   users.kafka.topics -> L3  (the topic catalogue)
#   users.ratelimit    -> L1  (login failures per e-mail, DEC-42)
#   users.bootstrap    -> L6  (the initial ADMIN, RF-USR-01)
#   users.breakglass   -> L6  (the recovery secret hash, RF-ROL-04)
#   users.legal        -> L5  (the current T&C version)
# ---------------------------------------------------------------------------

users:
  # RF-USR-01 - the initial ADMIN of a clean install. Idempotent: it is only
  # created when there is no active ADMIN. With no ADMIN_BOOTSTRAP_PASSWORD one
  # is generated and printed exactly once in the startup log.
  bootstrap:
    enabled:     ${ADMIN_BOOTSTRAP_ENABLED:true}
    email:       ${ADMIN_BOOTSTRAP_EMAIL:admin@frc.utn.edu.ar}
    password:    ${ADMIN_BOOTSTRAP_PASSWORD:}
    first-names: ${ADMIN_BOOTSTRAP_FIRST_NAMES:Admin}
    last-names:  ${ADMIN_BOOTSTRAP_LAST_NAMES:Inicial}
  # RF-ROL-04 - break-glass. The BCrypt hash of the installation secret, never
  # the secret itself: it is validated with matches(), so the plaintext is never
  # versioned and never has to exist on this machine.
  #
  # Generate it with cost 12, the project standard (DEC-38). The plan's test
  # fixture uses a cost-4 hash on purpose - it is a test, and cost 12 would add
  # ~100 ms per assertion. A cost-4 hash guarding the real secret is 16 rounds:
  # brute-forceable in seconds, and this secret is what recreates an ADMIN when
  # the platform has none left.
  breakglass:
    secret-hash: ${ADMIN_BREAKGLASS_SECRET_HASH:}
  legal:
    terms-version: "v1"          # DEC-31
  # SPEC §16.1 - the domain an e-mail must belong to in order to self-register.
  # A launch parameter, not a constant (the deployment decides it) and a LIST,
  # so a second institutional domain needs no code change. Today only the
  # student path enforces it; PROFESSOR/GESTOR still go through the whitelist.
  registration:
    allowed-domains: ${REGISTRATION_ALLOWED_DOMAINS:frc.utn.edu.ar}
  # Set-Cookie de sesion (fu_at/fu_rt). Default true: cualquier despliegue con
  # TLS real tiene que quedarse en true. Solo el docker-compose de este
  # proyecto lo pisa a false via env, porque no termina TLS en ningun lado
  # (spec "Sesion en Cookies", decision 4) - sin esto, Secure corta la cookie.
  cookie:
    secure: ${COOKIE_SECURE:true}
  jwt:
    issuer: users-service        # DEC-07
    access-ttl: PT10M
    refresh-ttl: P7D
    service-ttl: PT5M
    private-key-path: ${JWT_PRIVATE_KEY_PATH:./secrets/jwt-private.pem}   # DEC-18
    public-keys-dir: ${JWT_PUBLIC_KEYS_DIR:./secrets/jwks}
    active-kid: ${JWT_ACTIVE_KID:dev}
  otp:
    activation-ttl: PT30M        # DEC-33
    two-factor-ttl: PT5M
    max-attempts: 5
  ratelimit:
    login-max-failures: 5        # DEC-42
    login-window: PT15M
    reset-max-requests: 3        # pedidos de reset por email
    reset-window: PT15M
    twofactor-max-challenges: 5  # mails de 2FA por email
    twofactor-window: PT15M
    # Reenvios de enlace de activacion por email. El endpoint es PUBLICO y
    # manda mail, igual que /password/reset: sin este tope el unico limite es
    # el del gateway, que cuenta por IP y por lo tanto no protege una casilla
    # concreta -- basta cambiar de IP para seguir inundandola, y cada pedido
    # ademas agrega una fila a outbox_events. Mismo numero que reset porque es
    # el mismo gesto de la persona: "no me llego, mandalo de nuevo".
    activation-max-requests: 3
    activation-window: PT15M
  # Git provider linking (SPEC-git-provider-linking §4.3). DEC-GL-05: with no
  # credentials the provider stays disabled and the app still starts.
  git-providers:
    github:
      enabled:       ${GITHUB_LINK_ENABLED:false}
      client-id:     ${GITHUB_CLIENT_ID:}
      client-secret: ${GITHUB_CLIENT_SECRET:}
      redirect-uri:  ${GITHUB_REDIRECT_URI:}   # DEC-GL-07 / DEC-GL-19: {FRONT_ORIGIN}/vinculacion/callback
      scope:         ${GITHUB_SCOPE:}          # DEC-GL-10: empty by default
      state-ttl:     ${GITHUB_STATE_TTL:PT5M}  # DEC-GL-08
  kafka:
    # One topic per business domain, as required by the platform Kafka standard.
    topics:
      user-events:         ${TOPIC_USER_EVENTS:user-events}
      notification-events: ${TOPIC_NOTIFICATION_EVENTS:notification-events}
      course-events:       ${TOPIC_COURSE_EVENTS:course-events}
    # Draft consumed contract (Courses). Change via env/properties when agreed.
    course-validation:
      event-type:    ${COURSE_VALIDATION_EVENT_TYPE:COURSE-VALIDATION-RESOLVED}
      event-version: ${COURSE_VALIDATION_EVENT_VERSION:1}
      producer:      ${COURSE_VALIDATION_PRODUCER:tema-02-cursos}
      payload:
        user-id:   ${COURSE_VALIDATION_FIELD_USER_ID:userId}
        result:    ${COURSE_VALIDATION_FIELD_RESULT:result}
        course-id: ${COURSE_VALIDATION_FIELD_COURSE_ID:courseId}
  outbox:
    poller-enabled: ${OUTBOX_POLLER_ENABLED:true}
    polling-delay: ${OUTBOX_POLLING_DELAY:PT3S}

# ---------------------------------------------------------------------------
# OpenAPI / Swagger UI
#
# TODO cuelga del prefijo PUBLICO, y no es una preferencia estetica: es la
# unica forma de que la doc se vea. Tres restricciones se multiplican:
#
#   1. Este servicio no publica puertos (no-negociable 1). La unica puerta es
#      nginx en :3000.
#   2. nginx solo proxea /api/, /.well-known/ y /dev/ hacia el gateway. TODO lo
#      demas cae en la SPA de Angular, asi que un /swagger-ui.html clasico
#      devuelve el index.html del front, no la doc.
#   3. El gateway solo deja pasar sin JWT lo que matchea /api/*/public/**
#      (PublicRouteMatcher.API_PUBLIC_PATTERN).
#
# Con estos dos paths no hay que tocar nginx, ni agregar una ruta al gateway,
# ni abrir un permitAll en SecurityConfig: /api/users/** ya rutea aca y
# /api/users/public/** ya es publico. Moverlos fuera de este prefijo es
# romper las tres cosas a la vez.
#
# El placeholder en vez del literal "/api/users/public" es la misma convencion
# que usan los @RequestMapping: el prefijo tiene UN dueño, arriba.
# ---------------------------------------------------------------------------
springdoc:
  api-docs:
    path: ${app.api.public-path}/v3/api-docs
    enabled: ${OPENAPI_ENABLED:true}
  swagger-ui:
    path: ${app.api.public-path}/docs
    enabled: ${OPENAPI_ENABLED:true}
    # Sin esto la pantalla arranca mostrando el petstore de ejemplo y hay que
    # elegir el spec propio a mano en el dropdown.
    disable-swagger-default-url: true
    operations-sorter: method
    tags-sorter: alpha
    display-request-duration: true

logging:
  pattern:
    level: "%5p [${spring.application.name},%X{traceId:-},%X{spanId:-},%X{requestId:-}]"
