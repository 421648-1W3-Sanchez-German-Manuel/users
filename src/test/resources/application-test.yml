spring:
  datasource:
    url: jdbc:mysql://localhost:3306/users_test?connectionTimeZone=UTC&preserveInstants=true
    username: root
    password:
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate.jdbc.time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration
  data:
    redis:
      host: localhost
      port: 6379
  kafka:
    bootstrap-servers: localhost:9092
    consumer:
      group-id: users-service
      auto-offset-reset: earliest
      properties:
        spring.json.trusted.packages: "*"
        spring.json.fail.on.unknown.properties: false

server:
  port: 0

eureka:
  client:
    enabled: false

users:
  # Los tests arman sus propios ADMIN y varios cuentan cuantos hay activos
  # (RF-ROL-05). Un ADMIN sembrado en el arranque les cambiaria el conteo.
  bootstrap:
    enabled: false
  legal:
    terms-version: "v1"
  jwt:
    issuer: users-service
    access-ttl: PT10M
    refresh-ttl: P7D
    service-ttl: PT5M
    private-key-path: ./secrets/jwt-private.pem
    public-keys-dir: ./secrets/jwks
    active-kid: dev
  otp:
    activation-ttl: PT30M
    two-factor-ttl: PT5M
    max-attempts: 5
  ratelimit:
    login-max-failures: 5
    login-window: PT15M
    reset-max-requests: 3
    reset-window: PT15M
    twofactor-max-challenges: 5
    twofactor-window: PT15M
  kafka:
    topics:
      audit: tema-01-users.auditoria.v1
      student-registered: tema-01-users.alumno-registrado.v1
      notifications: tema-XX-notificaciones.email.v1
      course-validation: tema-02-cursos.validacion-resuelta.v1

logging:
  pattern:
    level: "%5p [${spring.application.name},%X{traceId:-},%X{requestId:-}]"
