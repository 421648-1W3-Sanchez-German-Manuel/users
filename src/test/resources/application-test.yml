spring:
  datasource:
    url: jdbc:mysql://localhost:3306/users_test?connectionTimeZone=UTC&preserveInstants=true
    username: root
    password:
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate.jdbc.time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration
  data:
    redis:
      host: localhost
      port: 6379
  kafka:
    # Platform broker when the shared event-bus replaces the local mock:
    # bootstrap-servers: ${KAFKA_BOOTSTRAP:event-bus:29092}
    bootstrap-servers: localhost:9092
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
    consumer:
      group-id: users-service
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      properties:
        spring.json.trusted.packages: "ar.edu.utn.frc.tup.p4.usersservice.*"
        spring.json.fail.on.unknown.properties: false

server:
  port: 0

eureka:
  client:
    enabled: false

users:
  # Los tests arman sus propios ADMIN y varios cuentan cuantos hay activos
  # (RF-ROL-05). Un ADMIN sembrado en el arranque les cambiaria el conteo.
  bootstrap:
    enabled: false
  legal:
    terms-version: "v1"
  jwt:
    issuer: users-service
    access-ttl: PT10M
    refresh-ttl: P7D
    service-ttl: PT5M
    private-key-path: ./secrets/jwt-private.pem
    public-keys-dir: ./secrets/jwks
    active-kid: dev
  otp:
    activation-ttl: PT30M
    two-factor-ttl: PT5M
    max-attempts: 5
  ratelimit:
    login-max-failures: 5
    login-window: PT15M
    reset-max-requests: 3
    reset-window: PT15M
    twofactor-max-challenges: 5
    twofactor-window: PT15M
    activation-max-requests: 3
    activation-window: PT15M
  kafka:
    topics:
      user-events: user-events
      notification-events: notification-events
      course-events: course-events
    course-validation:
      event-type: COURSE-VALIDATION-RESOLVED
      event-version: 1
      producer: tema-02-cursos
      payload:
        user-id: userId
        result: result
        course-id: courseId

logging:
  pattern:
    level: "%5p [${spring.application.name},%X{traceId:-},%X{requestId:-}]"
